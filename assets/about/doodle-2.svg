<?xml version="1.0" encoding="UTF-8"?><svg id="Layer_4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 607.69 214.52"><defs>
<style>.cls-1 {
  fill: none;
  stroke: #a4b51b;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 2px;

  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  animation: handwriting 1.4s ease-in-out forwards;
}

/* Letters appear one after another */
.cls-1:nth-of-type(1)  { animation-delay: 0s; }
.cls-1:nth-of-type(2)  { animation-delay: 0.3s; }
.cls-1:nth-of-type(3)  { animation-delay: 0.5s; }
.cls-1:nth-of-type(4)  { animation-delay: 0.7s; }
.cls-1:nth-of-type(5)  { animation-delay: 0.9s; }
.cls-1:nth-of-type(6)  { animation-delay: 1.1s; }
.cls-1:nth-of-type(7)  { animation-delay: 1.3s; }
.cls-1:nth-of-type(8)  { animation-delay: 1.5s; }
.cls-1:nth-of-type(9)  { animation-delay: 1.7s; }
.cls-1:nth-of-type(10) { animation-delay: 1.9s; }
.cls-1:nth-of-type(11) { animation-delay: 2.1s; }
.cls-1:nth-of-type(12) { animation-delay: 2.3s; }
.cls-1:nth-of-type(13) { animation-delay: 2.5s; }
.cls-1:nth-of-type(14) { animation-delay: 2.7s; }

@keyframes handwriting {
  to {
    stroke-dashoffset: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .cls-1 {
    animation: none;
    stroke-dashoffset: 0;
  }
}
